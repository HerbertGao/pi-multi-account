name: Claude Code version check

# Protected main requires reviewed, tested PRs, and Actions cannot create PRs here.
# Keep one actionable drift issue instead of attempting a forbidden direct push
# or opening a new duplicate every week. The maintainer batches the bump into a release.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: claude-code-version-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Report version drift without bypassing branch protection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view @anthropic-ai/claude-code version)"
          current="$(grep -oE 'CLAUDE_CODE_VERSION = "[^"]+"' index.ts | sed -E 's/.*"([^"]+)".*/\1/')"
          test -n "$current"
          printf '%s' "$latest" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$latest" = "$current" ]; then
            echo "Up to date: $current"
            exit 0
          fi
          title="Claude Code billing header version drift"
          body="The weekly check found CLAUDE_CODE_VERSION=$current while npm reports $latest. Update index.ts in a reviewed PR and run npm run release:check. This tracker is updated in place; protected main is never pushed directly."
          existing="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Claude Code billing header version drift") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
